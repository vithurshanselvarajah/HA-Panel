version: 2

updates:

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(cargo)"
    groups:

      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
          - "wry"
          - "tao"

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(ui)"
    groups:

      svelte:
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "svelte-check"
          - "svelte2tsx"

  - package-ecosystem: gomod
    directory: /sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(sidecar)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(ci)"
