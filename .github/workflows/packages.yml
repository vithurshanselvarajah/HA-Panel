name: Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            nodejs \
            npm \
            golang-go \
            fuse3

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Build
        run: |
          ./scripts/build.sh
          npx tauri build --config src-tauri/tauri.conf.json

      - name: Collect
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ha-panel-deb-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  deb-arm64:
    name: Debian package (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            nodejs \
            npm \
            golang-go \
            fuse3

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Build
        run: |
          ./scripts/build.sh
          npx tauri build --config src-tauri/tauri.conf.json

      - name: Collect
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ha-panel-deb-arm64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  apk:
    name: Alpine package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build
        run: ./scripts/build-alpine.sh --arch "${{ matrix.arch }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ha-panel-apk-${{ matrix.arch }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  binaries:
    name: Loose binaries (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            nodejs \
            npm \
            golang-go

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"

      - name: Build
        run: ./scripts/build.sh

      - name: Collect
        run: |
          mkdir -p dist
          cp src-tauri/target/release/ha-panel dist/ha-panel-${{ matrix.arch }}
          cp src-tauri/binaries/ha-panel-sidecar-* dist/ha-panel-sidecar-${{ matrix.arch }}
          cp -r ui/dist dist/frontend-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ha-panel-binaries-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
