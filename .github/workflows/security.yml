name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:

    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cargo-audit is built from source rather than taken from the
      # `rustsec/audit-check` action: that action is a Node 20 wrapper and
      # Node 20 is deprecated on the runner. Building the tool from the
      # current stable toolchain also means it is never older than the
      # advisories it is meant to understand.
      - uses: dtolnay/rust-toolchain@stable

      - name: Audit the Rust crates
        run: |
          set -eu
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Audit the frontend
        run: |
          set -eu
          cd ui
          npm ci
          npm audit --audit-level=high

      - name: Audit the Go modules
        run: |
          set -eu
          cd sidecar
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  repository:
    name: Repository scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build pinned vulnerability scanner
        run: docker build --tag ha-panel-trivy --file ci/Dockerfile.trivy ci

      - name: Scan repository secrets and configuration
        run: |
          docker run --rm -v "$PWD:/src:ro" ha-panel-trivy fs \
            --ignorefile /src/ci/.trivyignore \
            --scanners secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs /src/.git \
            --skip-dirs /src/ui/node_modules \
            --skip-dirs /src/src-tauri/target \
            --skip-dirs /src/ui/dist \
            /src

  package:
    name: Package scan
    runs-on: ubuntu-24.04
    needs: [dependencies, repository]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            nodejs \
            npm \
            golang-go

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the packages
        run: |
          ./scripts/build.sh
          ui/node_modules/.bin/tauri build --config src-tauri/tauri.conf.json

      - name: Build pinned vulnerability scanner
        run: docker build --tag ha-panel-trivy --file ci/Dockerfile.trivy ci

      # The scan is of the binaries that ship, not of the source tree.
      #
      # A scan of the tree reports every advisory in every module the lock
      # file mentions, whether or not the code is in the binary — the Go
      # standard library alone is enough to produce a list of findings that
      # no device will ever hit. Scanning the artefacts answers the
      # question that matters: is the thing a device runs vulnerable?
      - name: Collect the artefacts
        run: |
          mkdir -p scan-root/usr/bin
          cp src-tauri/target/release/ha-panel scan-root/usr/bin/
          cp src-tauri/binaries/ha-panel-sidecar-* scan-root/usr/bin/

      - name: Scan the release binaries
        run: |
          docker run --rm -v "$PWD/scan-root:/scan:ro" ha-panel-trivy rootfs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            /scan

      - name: Scan again for SARIF
        if: always()
        run: |
          docker run --rm -v "$PWD/scan-root:/scan:ro" ha-panel-trivy rootfs \
            --scanners vuln \
            --severity MEDIUM,HIGH,CRITICAL \
            --format sarif \
            --output /scan/trivy-results.sarif \
            /scan

      - name: Upload results to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scan-root/trivy-results.sarif
          category: trivy-package
