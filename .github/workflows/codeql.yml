name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:

    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:

          - language: rust
            build-mode: none

          - language: javascript-typescript
            build-mode: none

          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL's Rust extractor needs rustup and cargo on the path. The
      # runner has a default toolchain but not necessarily rustup itself,
      # so the toolchain is installed the same way every other job
      # installs it.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'

      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          set -eu
          case "${{ matrix.language }}" in
            go)
              cd sidecar && go build ./...
              ;;
          esac

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
