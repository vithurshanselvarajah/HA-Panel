name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The Tauri build script needs the sidecar to be beside the
      # application, even for a check or a test. The sidecar is built
      # from the Go sources, so Go is needed here too.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: sidecar/go.sum

      - name: Build the sidecar
        run: |
          set -eu
          suffix=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cd sidecar
          go build -trimpath -ldflags="-s -w" \
            -o "../src-tauri/binaries/ha-panel-sidecar-$suffix" .

      - name: Check the formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: sidecar/go.sum

      - name: Vet
        working-directory: sidecar
        run: go vet ./...

      - name: Test
        working-directory: sidecar
        run: go test ./...

      - name: Test the vendored SDK
        working-directory: sidecar/third_party/echomuse-sdk
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Check the types
        working-directory: ui
        run: npm run check

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Test
        working-directory: ui
        run: npm run test

  build:
    name: Build the packages
    runs-on: ubuntu-24.04
    needs: [rust, go, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            nodejs \
            npm \
            golang-go

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build
        run: ./scripts/build.sh

      - name: Bundle
        run: ui/node_modules/.bin/tauri build --config src-tauri/tauri.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: ha-panel-deb-amd64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  workflow-hygiene:
    name: Workflow hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Guard self-test
        run: python -m unittest discover -s tests -v

      - name: Pins and permissions
        run: python tools/check_workflows.py

      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

      - name: Check the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S error scripts/*.sh packaging/install.sh packaging/alpine/ha-panel.initd packaging/alpine/ha-panel.pre-install
