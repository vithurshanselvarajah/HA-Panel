name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  packages:
    name: Build the packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            nodejs \
            npm \
            golang-go \
            fuse3

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the Debian package
        run: |
          ./scripts/build.sh
          npx tauri build --config src-tauri/tauri.conf.json

      - name: Build the Alpine package
        run: ./scripts/build-alpine.sh --arch amd64

      - name: Collect
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          cp dist/*.apk dist/ 2>/dev/null || true
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ha-panel-release-amd64
          path: dist/*.deb
          if-no-files-found: error

  arm64:
    name: Build for arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            nodejs \
            npm \
            golang-go \
            fuse3

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build the Debian package
        run: |
          ./scripts/build.sh
          npx tauri build --config src-tauri/tauri.conf.json

      - name: Build the Alpine package
        run: ./scripts/build-alpine.sh --arch arm64

      - name: Collect
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: ha-panel-release-arm64
          path: dist/*.deb
          if-no-files-found: error

  publish:
    name: Publish
    needs: [packages, arm64]
    runs-on: ubuntu-24.04
    permissions:

      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.apk
          draft: true
          generate_release_notes: true
